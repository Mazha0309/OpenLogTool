[package]
name = "openlogtool_core"
version = "2.7.0-R"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[package.metadata.wasm-pack.profile.release]
# Rust already performs release optimization for this module. Avoid
# wasm-pack's separate Binaryen download so CI and Docker builds do not depend
# on a GitHub-hosted helper binary at build time.
wasm-opt = false

[profile.release]
# Release libraries are shipped once per native architecture. Thin LTO keeps
# build time reasonable while deduplicating generic code; runtime packages do
# not need the compiler symbol table.
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Keep the existing `sqlx::` call sites while the storage engine is migrated.
# This is a project-local compatibility facade backed by rusqlite on every
# platform and sqlite-wasm-rs in browsers; it is not the upstream SQLx crate.
sqlx = { package = "openlogtool_sqlite", path = "sqlite_compat" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
once_cell = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
