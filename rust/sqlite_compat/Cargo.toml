[package]
name = "openlogtool_sqlite"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
publish = false

[dependencies]
openlogtool_sqlite_macros = { path = "macros" }
rusqlite = { version = "0.39.0", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { version = "0.5.5", default-features = false }
sqlite-wasm-vfs = "0.2.0"
