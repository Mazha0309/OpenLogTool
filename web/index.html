<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <style>
    @font-face {
      font-family: 'SarasaGothicSC';
      src: url('fonts/SarasaGothicSC-subset.woff2') format('woff2');
      font-display: swap;
      font-weight: 400;
    }
    #loader { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: #faf8f2;
              font-family: sans-serif; color: #666; z-index: 9999; }
    #loader::after { content: '加载中…'; }
    .flt-app-ready #loader { display: none; }
  </style>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenLogTool amateur radio net logging and collaboration client.">
  <meta name="theme-color" content="#2196F3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpenLogTool">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <title>OpenLogTool</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loader"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flt-app-ready');
    });
  </script>
</body>
</html>
